<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中2数学 合同の証明 フレーズ組み立てマスター</title>
  <!-- Tailwind CSS CDN（v3） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <!-- カスタムスタイル -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-800">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-2.5 flex flex-col sm:flex-row justify-between items-center gap-2">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xl" aria-hidden="true">📐</span>
          <h1 class="text-lg sm:text-xl font-bold tracking-tight">合同の証明 フレーズ組み立てマスター</h1>
        </div>
        <p class="text-xs text-indigo-100 mt-0.5">※証明の「言い回し」と「論理の型」をテンポよくマスターしよう！</p>
      </div>

      <!-- 右側コントロール: サウンド・学習記録・ユーザー -->
      <div class="flex items-center gap-2 text-xs">
        <button id="btn-sound-toggle" type="button" class="p-1.5 bg-indigo-700/80 hover:bg-indigo-800 rounded text-base transition" title="効果音のON/OFF" aria-label="効果音のON/OFF">
          <span id="sound-icon">🔊</span>
        </button>

        <div class="bg-indigo-700/80 px-2.5 py-1.5 rounded flex items-center gap-2">
          <span>今日: <strong id="stat-today" class="text-amber-300 font-bold">0</strong> 問</span>
          <span class="text-indigo-300">|</span>
          <span>ベスト: <strong id="stat-best" class="text-amber-300 font-bold">0</strong> 問</span>
        </div>

        <button id="btn-profile" type="button" class="bg-indigo-700/80 hover:bg-indigo-800 px-2.5 py-1.5 rounded font-bold underline decoration-dotted text-indigo-200 hover:text-white transition" title="ID・名前設定">
          <span id="user-display">ゲスト</span>
        </button>
      </div>
    </div>
  </header>

  <!-- プロファイルモーダル（背景タップ・Escで閉じる / Enterで保存） -->
  <div id="profile-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="profile-title">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-5 space-y-4">
      <h3 id="profile-title" class="text-base font-bold text-slate-800 flex items-center gap-1.5">
        <span aria-hidden="true">👤</span> 学習者コード・名前の設定
      </h3>
      <p class="text-xs text-slate-500 leading-relaxed">
        任意のニックネームや4桁の番号を入力すると、この端末内で学習記録を個別に保存・切り替えできます。
      </p>
      <input type="text" id="input-profile-id" maxlength="12" placeholder="例: 1024 または たろう" enterkeyhint="done"
        class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="flex justify-end gap-2 pt-2">
        <button id="btn-profile-cancel" type="button" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">キャンセル</button>
        <button id="btn-profile-save" type="button" class="px-4 py-1.5 text-xs bg-indigo-600 text-white rounded hover:bg-indigo-700 font-bold">保存する</button>
      </div>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-5 flex flex-col gap-4">

    <!-- コントロールバー（単元セレクトボックスはJSが問題データから全自動生成） -->
    <div class="flex flex-wrap items-center justify-between gap-2 bg-white p-3 rounded-xl shadow-sm border border-slate-200">
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1">
          <label for="select-unit" class="text-xs font-bold text-slate-500">単元:</label>
          <select id="select-unit" class="text-xs font-semibold border border-slate-300 rounded-md px-2 py-1.5 bg-slate-50 focus:ring-2 focus:ring-indigo-500">
            <!-- JSが自動生成します -->
          </select>
        </div>

        <div class="flex items-center gap-1">
          <label for="select-problem" class="text-xs font-bold text-slate-500 ml-1">問題:</label>
          <select id="select-problem" class="text-xs font-semibold border border-slate-300 rounded-md px-2 py-1.5 bg-slate-50 max-w-[200px] truncate focus:ring-2 focus:ring-indigo-500"></select>
        </div>
      </div>

      <div class="flex gap-1.5 ml-auto">
        <button id="btn-prev" type="button" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded text-xs font-bold border border-slate-300 transition disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-slate-100 disabled:active:scale-100">◀ 前へ</button>
        <button id="btn-next" type="button" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded text-xs font-bold border border-slate-300 transition disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-slate-100 disabled:active:scale-100">次へ ▶</button>
      </div>
    </div>

    <!-- 問題エリア -->
    <section class="bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-slate-200">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2.5 mb-3">
        <span id="prob-badge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200"></span>
        <span id="prob-tag" class="text-xs text-slate-400 font-semibold"></span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
        <div class="md:col-span-2">
          <h2 id="prob-title" class="font-bold text-sm sm:text-base text-slate-800 mb-2"></h2>
          <div id="prob-statement" class="text-xs sm:text-sm text-slate-700 leading-relaxed"></div>
        </div>
        <!-- 幾何図形表示エリア -->
        <div id="prob-figure" class="flex justify-center items-center bg-slate-50 p-2 rounded-lg border border-slate-200 min-h-[140px] overflow-hidden"></div>
      </div>
    </section>

    <!-- 証明組み立てエリア（解答欄） -->
    <section class="bg-white p-4 rounded-xl shadow-sm border-2 border-indigo-200">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-1.5">
          <h3 class="text-sm font-bold text-indigo-950 flex items-center gap-1">
            <span aria-hidden="true">📝</span>
            <span>証明組み立てエリア</span>
          </h3>
          <span class="text-[11px] text-slate-500 hidden sm:inline">（▲▼で順番調整 / ✕でパレットへ戻す）</span>
        </div>
        <button id="btn-clear" type="button" class="text-xs text-rose-500 hover:text-rose-700 hover:underline font-semibold transition">
          ↺ 最初からやり直す
        </button>
      </div>

      <div id="drop-zone" class="min-h-[180px] p-2 sm:p-3 bg-indigo-50/40 rounded-lg border-2 border-dashed border-indigo-300 flex flex-col gap-2 transition-colors">
        <!-- 組み立て中のパーツがここに入る -->
      </div>
    </section>

    <!-- 持ち駒パレットエリア -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-sm font-bold text-slate-700 flex items-center gap-1">
          <span aria-hidden="true">🧩</span>
          <span>持ち駒パレット</span>
        </h3>
        <span class="text-[11px] text-slate-400">タップして解答欄へ追加</span>
      </div>

      <div id="palette-zone" class="flex flex-wrap gap-2 p-2 bg-slate-50 rounded-lg min-h-[90px] border border-slate-200">
        <!-- 選択肢パーツがここに入る（ネタバレなし） -->
      </div>
    </section>

    <!-- 判定ボタン & フィードバック -->
    <div class="flex flex-col items-center gap-3">
      <button id="btn-check" type="button" class="w-full sm:w-72 py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold rounded-xl shadow transition-all flex items-center justify-center gap-2">
        <span>✅ 証明の「型」を判定する</span>
      </button>

      <!-- 結果・解説表示 -->
      <div id="feedback-area" class="w-full hidden p-4 rounded-xl border text-sm leading-relaxed transition-all" aria-live="polite"></div>
    </div>

  </main>

  <footer class="text-center py-4 text-xs text-slate-400 border-t bg-white mt-auto">
    中2数学 合同の証明 フレーズ組み立てマスター &copy;
  </footer>

  <!-- ES Modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
