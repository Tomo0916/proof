<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>理由カードの一覧 | 合同の証明トレーニング</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tw-config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html { scroll-behavior: smooth; scroll-padding-top: 116px; }
    .nav-bar { max-width: 1120px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .nav-bar::-webkit-scrollbar { display: none; }
    .nav-bar a {
      white-space: nowrap; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 9999px;
      background: var(--paper); color: var(--ink-2); border: 1px solid var(--line-strong); text-decoration: none;
    }
    .nav-bar a:hover { border-color: var(--navy); color: var(--navy); }
    .rc-group h2 { font-size: 18px; font-weight: 700; color: var(--ink); margin: 6px 0 12px; }
    .rc-note { font-size: 13px; color: var(--muted); margin: -6px 0 12px; line-height: 1.7; }
    .rc-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .rc-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1000px) { .rc-grid { grid-template-columns: repeat(3, 1fr); } }
    .rc { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    /* アプリのカードと同じ見た目 */
    .rc-card {
      align-self: flex-start; font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.55;
      background: var(--paper); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px;
    }
    .rc-fig { display: flex; justify-content: center; background: var(--ground); border-radius: 8px; padding: 8px; }
    .rc-fig svg { max-width: 100%; height: auto; }
    .rc-example { font-size: 14px; color: var(--ink); line-height: 1.7; }
    .rc-label { display: inline-block; font-size: 11px; font-weight: 700; color: var(--navy); margin-right: 6px; }
    .rc-when { font-size: 13px; color: var(--ink-2); line-height: 1.8; }
    .rc-used { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px; }
    .rc-used summary { list-style: none; }
    .rc-links { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
    .rc-links a { font-size: 12px; color: var(--navy); background: var(--navy-faint); border-radius: 6px; padding: 3px 8px; text-decoration: none; }
    .rc-links a:hover { text-decoration: underline; }
  </style>
</head>
<body class="min-h-screen flex flex-col" style="background:var(--ground)">
  <header class="topbar wide">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="アプリにもどる">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 25 L12 8 L18 25 Z"/><path d="M14 25 L22 8 L28 25 Z" fill="currentColor" fill-opacity="0.15"/></svg></span>
        <span class="brand-name">理由カードの一覧</span>
      </a>
      <div class="topbar-actions">
        <a href="phrases.html" class="top-link hide-sm">言葉だけの一覧</a>
        <a href="index.html" class="top-link">問題にもどる</a>
      </div>
    </div>
    <nav id="nav" class="nav-bar" aria-label="グループ"></nav>
  </header>

  <main class="page wide flex-1 w-full flex flex-col gap-6 pt-5">
    <p class="text-sm text-slate-600 leading-relaxed max-w-2xl">
      証明で使うカードを、図といっしょにまとめました。図の同じ印（線の本数・弧の数）がついている辺や角が等しいことを表します。
      「この理由を使う問題」をタップすると、その問題を開けます。
    </p>
    <div id="groups" class="flex flex-col gap-6"></div>
  </main>

  <footer class="site-footer">
    <nav aria-label="ほかのページ"><a href="index.html">問題を解く</a><a href="phrases.html">証明で使う言葉</a></nav>
    中2数学 合同の証明トレーニング
  </footer>

  <script type="module" src="js/reasons.js"></script>
</body>
</html>
