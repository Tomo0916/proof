<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>理由カードの一覧 | 合同の証明トレーニング</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html { scroll-behavior: smooth; scroll-padding-top: 110px; }
    .nav-bar a {
      white-space: nowrap; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 9999px;
      background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe;
    }
    .nav-bar a:hover { background: #e0e7ff; }
    .rc-group h2 { font-size: 16px; font-weight: 700; color: #1e1b4b; margin: 8px 0 8px; }
    .rc-note { font-size: 12px; color: #475569; margin: -2px 0 10px; }
    .rc-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .rc-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1000px) { .rc-grid { grid-template-columns: repeat(3, 1fr); } }
    .rc { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    /* アプリのカードと同じ見た目 */
    .rc-card {
      align-self: flex-start; font-size: 14px; font-weight: 600; color: #0f172a;
      background: #fff; border: 1px solid #c7d2fe; border-left: 4px solid #6366f1; border-radius: 8px; padding: 6px 10px;
    }
    .rc-fig { display: flex; justify-content: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; }
    .rc-fig svg { max-width: 100%; height: auto; }
    .rc-example { font-size: 13px; color: #0f172a; }
    .rc-label { display: inline-block; font-size: 10px; font-weight: 700; color: #475569; background: #f1f5f9; border-radius: 4px; padding: 1px 6px; margin-right: 4px; }
    .rc-when { font-size: 12px; color: #475569; line-height: 1.7; }
    .rc-used { margin-top: auto; border-top: 1px dashed #e2e8f0; padding-top: 6px; }
    .rc-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .rc-links a { font-size: 11px; color: #4338ca; background: #eef2ff; border-radius: 6px; padding: 2px 6px; text-decoration: none; }
    .rc-links a:hover { background: #e0e7ff; text-decoration: underline; }
    .tier-badge.small { font-size: 10px; padding: 1px 6px; vertical-align: 2px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-xl" aria-hidden="true">📖</span>
        <h1 class="text-lg font-bold">理由カードの一覧</h1>
      </div>
      <a href="index.html" class="text-xs bg-indigo-700/80 hover:bg-indigo-800 px-3 py-1.5 rounded font-bold">← 問題にもどる</a>
    </div>
    <nav id="nav" class="nav-bar max-w-6xl mx-auto px-4 pb-2.5 flex gap-1.5 overflow-x-auto" aria-label="グループ"></nav>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-5 flex flex-col gap-5">
    <p class="text-xs sm:text-sm text-slate-600 leading-relaxed bg-white border border-slate-200 rounded-xl p-3">
      証明で使うカードを、図といっしょにまとめました。図の同じ印（線の本数・弧の数）がついている辺や角が等しいことを表します。
      「この理由を使う問題」をタップすると、その問題を開けます。
    </p>
    <div id="groups" class="flex flex-col gap-6"></div>
  </main>

  <footer class="text-center py-4 text-xs text-slate-400 border-t bg-white mt-auto">
    中2数学 合同の証明トレーニング｜理由カードの一覧
  </footer>

  <script type="module" src="js/reasons.js"></script>
</body>
</html>
